/* ================================================
  ATLAS CINEMA / Visual language: light, film, grain.
  The application logic and localStorage keys are unchanged.
   ================================================ */
:root{--bg:#050608;--surface:#0d1117;--surface2:#141920;--surface3:#1c2630;--line:#30363e;--text:#f6f4ef;--muted:#9aa4ae;--soft:#73808c;--purple:#efb878;--cyan:#a1d9d5;--amber:#f0b26c;--green:#89cbae;--red:#ff8791;--shadow:0 28px 70px #0009;--r:10px;font-family:'DM Sans',Inter,system-ui,sans-serif;color-scheme:dark}
*{scrollbar-color:#343d45 #0a0d11}
html{background:#050608}
body{background:radial-gradient(ellipse 74% 42% at 86% 4%,#172a35 0,transparent 80%),radial-gradient(ellipse 45% 48% at -10% 60%,#251b1b 0,transparent 78%),#050608;color:var(--text);letter-spacing:.002em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.125;z-index:20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
.shell{grid-template-columns:232px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#0a0c10f5,#07090cfb 70%);border-right:1px solid #30353a;padding:30px 16px 17px}
.brand{margin:0 7px 39px;gap:14px}
.brand-icon{width:49px;height:49px;border:1px solid #ac8d66aa;background:radial-gradient(circle at 65% 20%,#3d322a,#121519 68%);box-shadow:0 0 0 5px #e0b97b09,inset 0 0 22px #e5b77722;color:#edc18a;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.1em;border-radius:6px;display:flex;align-items:center;justify-content:center;padding-right:4px}
.brand-subletter{font-size:18px;transform:translate(-3px,6px)}
.brand b{font-size:21px;letter-spacing:.095em;font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1}
.brand small{font-size:8px;letter-spacing:.21em;color:#c2a27c;margin-top:7px;display:block}
.nav-title{margin:0 13px 13px;color:#806d5a;font-size:9px;letter-spacing:.25em}
.nav{gap:3px}.nav button{padding:12px 13px;color:#87939c;border-radius:6px;font-size:12px;font-weight:650;letter-spacing:.03em;position:relative;transition:background .2s,color .2s}
.nav button:hover{background:#ffffff0a;color:#f7eedf}
.nav button.active{background:linear-gradient(90deg,#d0a46b1c,transparent);border-color:transparent;color:#f4cd96;box-shadow:inset 2px 0 0 #ecb76e}
.nav button.active:after{content:'';width:3px;height:3px;border-radius:50%;position:absolute;right:10px;background:#edbb78;box-shadow:0 0 10px #edbb78}
.nav .emoji{font-size:17px;color:#bc9f7e}
.side-bottom{border-top:1px solid #2d3136}.side-bottom .tiny{font-size:10px;color:#7e8990}.side-bottom .mode{font-size:11px;letter-spacing:.04em}.online-ind{background:#d6a162}
.main{max-width:1800px;padding:26px clamp(23px,3.4vw,58px) 85px}
.topbar{padding:4px 0 28px;align-items:center}
.kicker{color:#c5a480;letter-spacing:.23em;font-weight:800;font-size:10px}.kicker-dot{font-size:9px;padding:0 12px;color:#647781}
.page-title{font-family:'Barlow Condensed',sans-serif;letter-spacing:.045em;font-weight:600;text-transform:uppercase;font-size:clamp(26px,3vw,38px)}
.subtitle{color:#8c949b;font-size:12px}
.pill{border-color:#4d4540;background:#27211d;color:#edc7a1;border-radius:4px;font-size:10px;letter-spacing:.08em;padding:7px 11px}
.pill.good{background:#17251e;border-color:#446e55;color:#aad5bb}
.pill.warn{background:#30251b;border-color:#795d3c;color:#ffcc96}
.btn{border-color:#4a4d50;background:linear-gradient(#20242a,#171b20);border-radius:5px;color:#e6e6e3;letter-spacing:.025em;box-shadow:none;transition:.2s}
.btn:hover:not(:disabled){background:#272e35;transform:translateY(-1px);filter:none;border-color:#a88b67;color:#fff}
.btn.primary{background:#dfac6d;border-color:#e2b981;color:#12110f;box-shadow:0 9px 33px #e0ad4f22;font-weight:850}
.btn.primary:hover:not(:disabled){background:#f1c58f;color:#111}
.btn.cyan{background:#203537;border:1px solid #5b8988;color:#bbede5}
.btn.ghost{background:#0a0c0dcc;border-color:#777f8299;color:#f0eee9}
.btn.sm{border-radius:5px}
.card{border:1px solid #35383d;background:linear-gradient(151deg,#12171bcf,#0c1015e8);border-radius:10px;padding:23px;box-shadow:0 11px 38px #00000028}
.card.soft{background:linear-gradient(135deg,#17191b,#101416);min-height:188px}
.card h3,.card h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:20px;font-weight:650;letter-spacing:.08em}
.card-head h3{font-size:21px}
.section{margin-top:23px}.section-title{font-family:'Barlow Condensed';letter-spacing:.09em;text-transform:uppercase;font-size:23px}
.smalltxt{color:#a2aaad;font-size:12px}.muted{color:#9ba3a9}
.eyebrow{color:#bd9c73;font-size:10px;letter-spacing:.18em}
.number{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;color:#f8f6f2;letter-spacing:.005em}
.metric-icon{font-size:23px;color:#b99a74}
.cinema-section-heading{display:flex;align-items:center;gap:12px;font-family:'Barlow Condensed',sans-serif;color:#e8d5bd;font-size:17px;font-weight:700;letter-spacing:.17em;margin:28px 0 13px}
.cinema-section-heading .section-reel{font-size:11px;color:#dfb581}
.cinema-section-heading .thin-rule{height:1px;flex:1;background:linear-gradient(90deg,#77604677,transparent)}
.minor-counter{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.1em;color:#737e83}
/* Feature film artwork: all original CSS, no third-party promotional stills */
.hero.cinema-hero{padding:0;min-height:472px;border:1px solid #4c5156;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 75% 45%,#385160 0,#17232a 21%,transparent 42%),linear-gradient(92deg,#090c0e 0,#11181d 53%,#0b141d 100%);box-shadow:0 25px 90px #0009;isolation:isolate}
.hero.cinema-hero:before{content:"";inset:0;width:auto;height:auto;right:auto;top:auto;border:0;border-radius:0;position:absolute;background:linear-gradient(90deg,#080a0cf7 0,#090b0ded 31%,#090b0ca8 54%,#090b0c03 96%);box-shadow:none;z-index:2}
.hero.cinema-hero:after{content:"";position:absolute;inset:auto 0 0;height:19%;pointer-events:none;background:linear-gradient(0deg,#080a0ccf,transparent);z-index:2}
.hero-inner{position:relative;z-index:4;max-width:760px;min-height:472px;padding:43px 0 27px 44px;display:flex;flex-direction:column;align-items:flex-start}
.cinema-art{position:absolute;inset:0;overflow:hidden;z-index:1;background:radial-gradient(ellipse at 75% 50%,#8ec0bb45 0%,transparent 35%)}
.cinema-art:before{content:"";position:absolute;inset:-22%;background:repeating-linear-gradient(111deg,transparent 0,transparent 42px,#bad8e003 42px,#d0f2e00a 44px,transparent 45px),radial-gradient(ellipse at 72% 50%,#b7d4cf11 0,transparent 40%);transform:rotate(-6deg)}
.cinema-art:after{content:"";position:absolute;right:-15%;top:-30%;width:83%;height:165%;border-radius:50%;background:radial-gradient(ellipse at center,#edf9ff00 0 12%,#ccf4e518 16%,#101f2744 35%,#07101933 49%,transparent 66%);filter:blur(18px)}
.cinema-tunnel{position:absolute;right:7%;top:5%;height:85%;aspect-ratio:1/1;transform:rotate(-7deg);filter:drop-shadow(0 0 54px #a7f6e447);animation:slowDrift 13s ease-in-out infinite alternate}
.tunnel-ring{position:absolute;inset:0;border-radius:48% 49% 46% 51%;border:2px solid #92bdc555;box-shadow:0 0 27px #aad4d555,inset 0 0 29px #a9e7e533;transform:rotate(8deg)}
.ring-2{inset:8%;transform:rotate(15deg);border:13px solid #1e3347b0;box-shadow:0 0 5px 3px #8bc6c759,inset 0 0 22px #b4edee33}

<script>
'use strict';
/* Atlas — módulo local. Não requer biblioteca, API paga ou servidor externo. */
const TABLES=['settings','records','characters','realities','clues','theories','links','audios','analyses','snapshots'];
const TITLES={dashboard:['Sua sessão','Explore a série como uma investigação cinematográfica, no seu ritmo.'],episodes:['Sala dos episódios','Cada capítulo abre novas perguntas. Registre suas descobertas sem spoilers.'],map:['Universo de conexões','Seus personagens, realidades e teorias conectados na mesma história.'],characters:['Personagens e realidades','Identidades, relações e ambientes conhecidos até agora.'],clues:['Pistas','O que foi observado, o que é provável e o que permanece em aberto.'],theories:['Minhas teorias','Hipóteses preservadas exatamente como você as formulou.'],archive:['Arquivo de investigação','Revise suas ideias e descubra como a interpretação evoluiu.'],settings:['Dados e análises','Sincronização, cópias de segurança e integração com o ChatGPT.']};
const TOTAL={1:9,2:10};
const CACHED='atlas_darkmatter_v1_cache', QUEUED='atlas_darkmatter_v1_pending';
const INITIAL_SETTINGS={id:'main',progress:{1:0,2:0},season:1,episode:1,updatedAt:''};
let state=emptyState(), pending=[], tab='dashboard', cloud=!!(window.google&&google.script&&google.script.run),busy=false,serverDatabase='',searchText='',toastTimer,recognition=null,voiceOn=false,voiceBase='',audioTarget=1,mapSelected=null;
function emptyState(){const o={};TABLES.forEach(k=>o[k]=[]);o.settings=[structuredCloneSafe(INITIAL_SETTINGS)];return o;}
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x));}
function uid(prefix='it'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function fmtdate(v){if(!v)return 'Sem data';let d=new Date(v);return isNaN(d)?'Sem data':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});}
function nrm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function s(){return state.settings[0]||INITIAL_SETTINGS;}
function prog(season){return Number(s().progress?.[season]||0);}
function cur(){return {season:Number(s().season)||1,episode:Number(s().episode)||1};}
function epCode(se,ep){return 'T'+se+'E'+String(ep).padStart(2,'0')}
function canSee(x){const {season,episode}=cur();if(!x)return false;const sx=Number(x.season||1),ex=Number(x.episode||1);const max=prog(sx);return ex<=max||(sx===season&&ex===episode&&ex<=max+1);}
function entries(kind,options={}){return (state[kind]||[]).filter(x=>options.all||canSee(x)).sort((a,b)=>Number(b.season||0)-Number(a.season||0)||Number(b.episode||0)-Number(a.episode||0)||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));}
function item(kind,id){return (state[kind]||[]).find(x=>x.id===id);}
function currentItems(kind){const {season,episode}=cur();return entries(kind).filter(x=>Number(x.season)===season&&Number(x.episode)===episode);}
function localSave(){try{localStorage.setItem(CACHED,JSON.stringify(state));localStorage.setItem(QUEUED,JSON.stringify(pending))}catch(e){notify('Armazenamento local cheio. Exporte um backup.',true)}}
function localLoad(){try{const saved=JSON.parse(localStorage.getItem(CACHED)||'null');if(saved&&typeof saved==='object'){TABLES.forEach(k=>{if(Array.isArray(saved[k]))state[k]=saved[k]});}pending=JSON.parse(localStorage.getItem(QUEUED)||'[]');if(!Array.isArray(pending))pending=[];}catch(e){pending=[]}if(!state.settings.length)state.settings=[structuredCloneSafe(INITIAL_SETTINGS)];}
function applyChange(change){const arr=state[change.kind];if(!Array.isArray(arr))return;const i=arr.findIndex(x=>x.id===change.id);if(change.op==='delete'){if(i>=0)arr.splice(i,1)}else{if(i<0)arr.push(change.item);else arr[i]=change.item;}}
function put(kind,obj){const value=Object.assign({},obj,{updatedAt:new Date().toISOString()});const change={op:'upsert',kind,id:value.id,item:value,opId:uid('op')};applyChange(change);pending.push(change);localSave();render();flush();return value;}
function putBatch(changes){if(!changes.length)return;const now=new Date().toISOString();changes.forEach(c=>{c.opId=uid('op');if(c.op==='upsert'){c.item.updatedAt=now;applyChange(c)}else applyChange(c);pending.push(c)});localSave();render();flush();}
function del(kind,id){if(!confirm('Excluir este registro? Essa ação também será sincronizada.'))return;putBatch([{op:'delete',kind,id}]);}
function saveSettings(patch){const v=Object.assign({},s(),patch);v.progress=Object.assign({},s().progress||{},patch.progress||{});put('settings',v);}
function rpc(name,args){return new Promise((resolve,reject)=>{if(!cloud)return reject(new Error('Modo local'));google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(Error(err?.message||String(err))))[name](...(args||[]))})}
async function refresh(){if(!cloud){setSyncIndicator();return;}if(busy)return;setSyncIndicator('sync');try{const res=await rpc('getAtlasState');if(!res?.ok)throw Error('Resposta inválida do servidor');const updated=emptyState();TABLES.forEach(k=>{if(Array.isArray(res.state[k]))updated[k]=res.state[k]});state=updated;if(!state.settings.length)state.settings=[structuredCloneSafe(INITIAL_SETTINGS)];pending.forEach(applyChange);serverDatabase=res.databaseUrl||'';localSave();setSyncIndicator();render();}catch(e){setSyncIndicator('error');notify('Sem conexão com o Drive: '+e.message,true)}}
async function flush(){if(!cloud||busy||!pending.length){setSyncIndicator();return;}busy=true;setSyncIndicator('sync');const sending=pending.slice(0,40);let okToRetry=false;try{const res=await rpc('applyAtlasChanges',[sending]);if(!res?.ok)throw Error('Falha ao salvar');const ids=new Set(sending.map(x=>x.opId));pending=pending.filter(x=>!ids.has(x.opId));localSave();setSyncIndicator();okToRetry=true;}catch(e){setSyncIndicator('error');notify('Registro guardado neste dispositivo; sincronização pendente: '+e.message,true);}finally{busy=false;if(pending.length&&navigator.onLine&&okToRetry)setTimeout(flush,1400);}}
function setSyncIndicator(status){const p=document.getElementById('sync-pill'),side=document.getElementById('side-mode'),dot=document.getElementById('side-dot');const value=!cloud?'local':status==='error'?'erro':status==='sync'||busy?'sync':pending.length?'pending':'ok';const styles={local:['● MEMÓRIA LOCAL','Salvo no navegador',false],erro:['⚠ Sem conexão','Reconectar depois',false],sync:['◌ Sincronizando','Salvando no Drive...',false],pending:['● Pendente','Alterações locais pendentes',false],ok:['✓ Drive sincronizado','Sincronizado na nuvem',true]};const z=styles[value];p.textContent=z[0];p.className='pill '+(z[2]?'good':value==='erro'||value==='pending'?'warn':'');side.textContent=z[1];dot.className='online-ind'+(z[2]?' ok':'');}
function notify(message,error=false){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');t.style.borderColor=error?'#a34c66':'#4a658c';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4800);}
function setTab(next){tab=next;searchText='';mapSelected=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){const [name,sub]=TITLES[tab];document.getElementById('page-title').textContent=name;document.getElementById('page-sub').textContent=sub;document.querySelectorAll('[data-tab]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));const v=document.getElementById('view');v.innerHTML=({dashboard:drawDashboard,episodes:drawEpisodes,map:drawMap,characters:drawCharacters,clues:drawClues,theories:drawTheories,archive:drawArchive,settings:drawSettings}[tab])();setSyncIndicator();if(tab==='map'){const map=v.querySelector('.map-shell');if(map&&map.querySelector('svg'))map.scrollLeft=(map.scrollWidth-map.clientWidth)/2;}}
function blockEmpty(title,description){return `<div class="empty"><b>${esc(title)}</b>${esc(description)}</div>`}
function badge(status){const cls=/confirmad|resolvid|verificad/i.test(status)?'confirmado':/refutad|descartad/i.test(status)?'refutada':/hip[oó]tes|teoria/i.test(status)?'teoria':'pista';return `<span class="tag ${cls}">${esc(status||'Em aberto')}</span>`}
function drawDashboard(){const {season,episode}=cur(),total=prog(1)+prog(2),count=19,seenRecords=entries('records'),latest=seenRecords.slice(0,4);return `
<div class="hero cinema-hero"><div class="cinema-art" aria-hidden="true"><div class="cinema-tunnel"><i class="tunnel-ring ring-1"></i><i class="tunnel-ring ring-2"></i><i class="tunnel-ring ring-3"></i><i class="tunnel-ring ring-4"></i><i class="tunnel-ring ring-5"></i><i class="tunnel-ring ring-6"></i><i class="portal-door"></i><i class="lone-figure"></i></div><div class="cinema-floor"></div></div><div class="hero-inner"><div class="cinema-meta"><span class="meta-line"></span> UMA EXPERIÊNCIA DE INVESTIGAÇÃO <span class="meta-circle">✦</span> SEM SPOILERS</div><h2 class="cinema-title">DARK<span>MATTER</span></h2><div class="cinema-subhead">MATÉRIA ESCURA <span>·</span> ATLAS DAS REALIDADES</div><p class="cinema-description">Toda resposta abre outra porta. Investigue a história, conecte as pistas e preserve cada teoria — <strong>uma descoberta de cada vez.</strong></p><div class="flex wrap cinema-actions"><button class="btn primary" data-tab="episodes"><span class="play-circle">▶</span> INVESTIGAR T${season} · E${String(episode).padStart(2,'0')}</button><button class="btn ghost" data-tab="map">EXPLORAR O MAPA ↗</button></div><div class="hero-foot"><span class="hero-foot-line"></span><span>VOCÊ ESTÁ NO CAPÍTULO <b>${epCode(season,episode)}</b></span><span class="hero-foot-index">${String(total).padStart(2,'0')} / 19</span></div></div></div>
<div class="section cinema-section-heading"><span class="section-reel">◆</span> SEU ARQUIVO DE INVESTIGAÇÃO <span class="thin-rule"></span><span class="minor-counter">ACOMPANHAMENTO EM TEMPO REAL</span></div>
<div class="section grid cols4 cinema-metrics"><div class="card"><div class="flex spread"><span class="eyebrow">Episódios vistos</span><span class="metric-icon">▶</span></div><div class="number">${total}<span class="muted" style="font-size:15px"> / ${count}</span></div><div class="smalltxt">Temporadas 1 e 2</div></div><div class="card"><div class="flex spread"><span class="eyebrow">Pistas</span><span class="metric-icon">⌕</span></div><div class="number">${entries('clues').length}</div><div class="smalltxt">Sem revelar o futuro</div></div><div class="card"><div class="flex spread"><span class="eyebrow">Teorias</span><span class="metric-icon">✧</span></div><div class="number">${entries('theories').length}</div><div class="smalltxt">Sua linha de raciocínio</div></div><div class="card"><div class="flex spread"><span class="eyebrow">Conexões</span><span class="metric-icon">◎</span></div><div class="number">${entries('links').length}</div><div class="smalltxt">Mapa em evolução</div></div></div>
<div class="section grid cols2 cinema-report"><div class="card"><div class="card-head"><h3>PROGRESSO DA TEMPORADA</h3><span class="smalltxt">${Math.round(100*total/count)}% da jornada</span></div>${[1,2].map(se=>`<div style="margin:0 0 15px"><div class="flex spread smalltxt" style="margin-bottom:7px"><b style="color:#d8e5ff">Temporada ${se}</b><span>${prog(se)} de ${TOTAL[se]} episódios</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*prog(se)/TOTAL[se]}%"></div></div></div>`).join('')}<div class="hint">🔒 Um episódio futuro nunca aparece nas suas análises antes de ser marcado como assistido.</div></div>
<div class="card"><div class="card-head"><h3>Últimas impressões</h3><button class="btn sm ghost" data-tab="episodes">Ver todas →</button></div>${latest.length?`<div class="row-list">${latest.map(x=>`<div class="item"><div class="flex spread"><div class="item-title">${epCode(x.season,x.episode)} · ${esc(x.type||'Impressão')}</div><span class="smalltxt">${fmtdate(x.createdAt)}</span></div><p>${esc(String(x.text||'').slice(0,185))}${String(x.text||'').length>185?'…':''}</p></div>`).join('')}</div>`:blockEmpty('A investigação ainda não começou','Abra o episódio 1 e grave suas primeiras impressões por voz.')}</div></div>
<div class="section cinema-section-heading"><span class="section-reel">✧</span> SUA PRÓXIMA CENA <span class="thin-rule"></span></div><div class="section grid cols3 cinema-experience"><div class="card soft"><div class="card-head"><h3>🎙️ DIÁRIO DE VOZ</h3></div><p class="smalltxt">Use o botão de voz ou o microfone do teclado do dispositivo. O texto será salvo com a origem do episódio.</p><button class="btn sm" data-tab="episodes">Registrar →</button></div><div class="card soft"><div class="card-head"><h3>◎ INVESTIGAÇÃO PROFUNDA</h3></div><p class="smalltxt">Prepare o pacote de contexto para pesquisar o episódio comigo, sem spoilers.</p><button class="btn sm" data-action="copyPrompt">Preparar pedido →</button></div><div class="card soft"><div class="card-head"><h3>▧ SEU ARQUIVO PRIVADO</h3></div><p class="smalltxt">${cloud?'Painel conectado ao Apps Script. Os registros vão para uma planilha no Drive.':'Seus registros ficam neste navegador. Baixe backups JSON para preservar suas descobertas.'}</p><button class="btn sm" data-tab="settings">Ver dados →</button></div></div>`;}
function optionSeason(){return `<option value="1" ${cur().season===1?'selected':''}>Temporada 1 · 9 episódios</option><option value="2" ${cur().season===2?'selected':''}>Temporada 2 · 10 episódios</option>`}
function drawEpisodes(){const {season,episode}=cur(),completed=prog(season),thisDone=episode<=completed,nextAllowed=episode<=completed+1,notes=currentItems('records'),audio=currentItems('audios'),a=currentItems('analyses').at(0),epOptions=Array.from({length:TOTAL[season]},(_,i)=>{const x=i+1;return `<option value="${x}" ${x===episode?'selected':''} ${x>completed+1?'disabled':''}>Episódio ${String(x).padStart(2,'0')}${x<=completed?' ✓':''}</option>`}).join('');return `
<div class="episode-scene"><div class="episode-scene-art" aria-hidden="true"><span class="episode-halo"></span><span class="episode-halo echo"></span></div><div class="episode-scene-inner"><div class="eyebrow">AGORA EM INVESTIGAÇÃO <span class="sep">✦</span> ARQUIVO ${epCode(season,episode)}</div><h2>Cada pista abre<br><em>uma nova porta.</em></h2><p>Fale, questione, conecte. O que você descobre fica aqui.</p><div class="scene-counter">TEMPORADA ${String(season).padStart(2,'0')} <span>—</span> EPISÓDIO ${String(episode).padStart(2,'0')}</div></div></div>
<div class="card episode-navigation"><div class="episode-toolbar"><div class="form-control"><label for="sel-season">Temporada</label><select class="field" id="sel-season">${optionSeason()}</select></div><div class="form-control"><label for="sel-episode">Episódio</label><select class="field" id="sel-episode">${epOptions}</select></div><div class="grow"></div><button class="btn ${thisDone?'ghost':'primary'}" data-action="finishEpisode" ${thisDone||!nextAllowed?'disabled':''}>${thisDone?'✓ Episódio concluído':'✓ Concluir episódio'}</button>${thisDone&&episode<TOTAL[season]?'<button class="btn cyan" data-action="nextEpisode">▶ Próximo episódio</button>':''}</div>
<div class="divider"></div><div class="episode-dots">${Array.from({length:TOTAL[season]},(_,i)=>{let x=i+1;return `<button class="ep-dot ${x<=completed?'done':''} ${x===episode?'selected':''} ${x>completed+1?'locked':''}" data-action="gotoEpisode" data-episode="${x}" ${x>completed+1?'disabled':''}>E${String(x).padStart(2,'0')}${x<=completed?' ✓':''}</button>`}).join('')}</div></div>
<div class="section grid cols2 episode-section"><div class="card"><div class="flex spread wrap"><div><div class="eyebrow">SEU DIÁRIO DE BORDO</div><div class="episode-large">${epCode(season,episode)}</div></div>${badge(thisDone?'Assistido':'Em andamento')}</div><p class="smalltxt" style="margin-bottom:15px">Fale suas impressões livremente. Não é necessário fazer resumos nem usar termos técnicos.</p><div class="form-control"><label for="note-type">O que você vai registrar?</label><select class="field" id="note-type"><option>Impressão</option><option>Dúvida</option><option>Teoria espontânea</option><option>Detalhe observado</option></select></div><div class="form-control" style="margin-top:12px"><label for="voice-text">Suas impressões</label><textarea id="voice-text" class="field" rows="7" placeholder="Use o microfone do teclado ou clique em 'Iniciar voz' e conte o que pensou do episódio..."></textarea></div><div class="flex wrap" style="margin-top:12px"><button class="btn cyan" id="voice-btn" data-action="toggleVoice">🎙 FALAR MINHAS IMPRESSÕES</button><button class="btn" data-action="voiceHelp">? Como falar sem digitar</button><button class="btn primary" data-action="saveVoice">✓ Salvar impressão</button></div><div id="voice-status" class="smalltxt" style="margin-top:9px">O reconhecimento de voz depende do navegador; o ditado do teclado também funciona no tablet e no computador.</div></div>
<div class="card"><div class="card-head"><h3>◉ TRECHOS DE ÁUDIO · 15 MIN</h3><span class="pill">Metadados</span></div><p class="smalltxt">Registre até 4 partes do episódio. O painel salva o nome/tamanho, mas <b>não envia nem armazena MP3</b> no Google Drive ou no ChatGPT.</p>${[1,2,3,4].map(i=>{const f=audio.find(x=>Number(x.part)===i);return `<div class="audio-part"><div class="grow"><div class="aud-name">Trecho ${i} · ${String((i-1)*15).padStart(2,'0')}–${String(i*15).padStart(2,'0')} min</div><div class="aud-desc">${f?esc(f.fileName)+' · '+Number(f.sizeMB||0).toFixed(1)+' MB · '+fmtdate(f.createdAt):'Nenhum áudio registrado'}</div></div><button class="btn sm" data-action="pickAudio" data-part="${i}">${f?'Alterar':'Registrar'}</button></div>`}).join('')}<div class="hint warning" style="margin-top:15px">Arquivos completos de obras comerciais só devem ser gravados e compartilhados quando permitido. Para analisar, envie os arquivos diretamente na conversa, se tiver autorização.</div></div></div>
<div class="section grid cols2"><div class="card"><div class="card-head"><h3>SUAS IMPRESSÕES</h3><span class="smalltxt">${notes.length} registro(s)</span></div>${notes.length?`<div class="row-list">${notes.map(x=>`<div class="item"><div class="flex spread"><div class="item-title">${esc(x.type||'Impressão')}</div><button class="btn sm danger" data-action="remove" data-kind="records" data-id="${esc(x.id)}">Excluir</button></div><p>${esc(x.text||'')}</p><div class="meta">${fmtdate(x.createdAt)}</div></div>`).join('')}</div>`:blockEmpty('Nenhuma impressão registrada','Você pode falar sem organizar suas ideias. O Atlas cuida da organização.')}</div><div class="card"><div class="card-head"><h3>ANÁLISE DO EPISÓDIO</h3><button class="btn sm" data-action="copyPrompt">Preparar pesquisa</button></div>${a?`<div class="item"><div class="eyebrow">Resumo sem spoilers</div><p>${esc(a.summary||'Sem resumo.')}</p></div>${Array.isArray(a.questions)&&a.questions.length?`<div style="margin-top:12px" class="eyebrow">Perguntas em aberto</div>${a.questions.map(q=>`<p class="smalltxt">• ${esc(q)}</p>`).join('')}`:''}<div class="flex wrap" style="margin-top:14px"><button class="btn sm" data-action="listenAnalysis">🔊 Ouvir análise</button><button class="btn sm" data-tab="settings">Importar outra</button></div>`:blockEmpty('Análise ainda não importada', season===1&&episode===1?'Conclua o episódio 1 acima para liberar automaticamente o dossiê de pesquisa, personagens e pistas, sem spoilers.':'Após concluir o episódio, envie suas impressões para o ChatGPT e importe o JSON da investigação.')}</div></div>`;}
function drawCollection(kind,title,subtitle){let data=entries(kind).filter(x=>!searchText||nrm([x.name,x.title,x.text,x.description].join(' ')).includes(nrm(searchText)));return `<div class="card"><div class="flex spread wrap" style="margin-bottom:16px"><div><h3 style="margin:0">${title}</h3><p class="smalltxt" style="margin:6px 0 0">${subtitle}</p></div><button class="btn primary" data-action="newItem" data-kind="${kind}">+ Novo registro</button></div><div class="form-control"><input class="field" id="search-collection" value="${esc(searchText)}" placeholder="Buscar registros..."></div></div><div class="section grid cols2">${data.length?data.map(x=>`<div class="entry-card"><div class="flex spread" style="align-items:flex-start"><div class="grow"><div class="eyebrow">${epCode(x.season,x.episode)} · ${x.origin==='assistant'?'Análise':'Você'}</div><h4 style="margin-top:7px">${esc(x.title||x.name||'Sem título')}</h4></div>${badge(x.status||'Em aberto')}</div><p>${esc(x.description||x.text||'Sem descrição.')}</p><div class="entry-actions"><button class="btn sm" data-action="editItem" data-kind="${kind}" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-action="remove" data-kind="${kind}" data-id="${esc(x.id)}">Excluir</button></div></div>`).join(''):blockEmpty('Nenhum registro nesta categoria','Você pode adicionar manualmente ou importar minha análise após o episódio.')}</div>`}
function drawCharacters(){return `<div class="hint">Identifique apenas personagens e realidades que já apareceram. Cadastros importados pelo ChatGPT também respeitam o limite do episódio assistido.</div><div class="section grid cols2"><div class="card soft"><div class="flex spread"><h3>♙ Personagens</h3><button class="btn sm primary" data-action="newItem" data-kind="characters">+ Personagem</button></div><p class="smalltxt">${entries('characters').length} personagem(ns) identificado(s)</p></div><div class="card soft"><div class="flex spread"><h3>◈ Realidades</h3><button class="btn sm primary" data-action="newItem" data-kind="realities">+ Realidade</button></div><p class="smalltxt">${entries('realities').length} realidade(s) registrada(s)</p></div></div><div class="section grid cols2">${['characters','realities'].map(kind=>`<div class="card"><div class="card-head"><h3>${kind==='characters'?'Personagens conhecidos':'Realidades identificadas'}</h3></div>${entries(kind).length?`<div class="row-list">${entries(kind).map(x=>`<div class="item"><div class="flex spread"><div><div class="item-title">${esc(x.name||'Sem nome')}</div><div class="meta">${epCode(x.season,x.episode)} · ${x.origin==='assistant'?'Pesquisa':'Seu registro'}</div></div><button class="btn sm" data-action="editItem" data-kind="${kind}" data-id="${esc(x.id)}">Editar</button></div><p>${esc(x.description||'')}</p></div>`).join('')}</div>`:blockEmpty('Aguardando descobertas','Os primeiros registros surgem após sua investigação.')}</div>`).join('')}</div>`}
function drawClues(){return drawCollection('clues','Banco de pistas','Pistas confirmadas, suspeitas e mistérios em aberto.')}
function drawTheories(){return drawCollection('theories','Laboratório de hipóteses','Uma teoria descartada continua no histórico; nada é apagado automaticamente.')}
function graphNodeList(){return [...entries('characters').map(x=>({...x,kind:'characters',label:x.name||'Personagem'})),...entries('realities').map(x=>({...x,kind:'realities',label:x.name||'Realidade'})),...entries('clues').map(x=>({...x,kind:'clues',label:x.title||'Pista'})),...entries('theories').map(x=>({...x,kind:'theories',label:x.title||'Teoria'}))].slice(0,50)}
function drawMap(){const nodes=graphNodeList(),edges=entries('links').filter(l=>nodes.some(n=>n.id===l.from)&&nodes.some(n=>n.id===l.to)),c={characters:'#9f8cff',realities:'#58d4dd',clues:'#f5bb6b',theories:'#76daab'};let svg='';if(nodes.length){const positions=new Map();nodes.forEach((n,i)=>{const ring=i<11?1:i<28?2:3,radius=ring===1?130:ring===2?210:300,start=ring===1?0:ring===2?11:28,count=ring===1?Math.min(nodes.length,11):ring===2?Math.min(Math.max(nodes.length-11,0),17):Math.max(nodes.length-28,1),angle=-Math.PI/2+((i-start)/count)*2*Math.PI;positions.set(n.id,{x:460+radius*Math.cos(angle),y:355+radius*Math.sin(angle)})});svg=`<svg viewBox="0 0 920 710" role="img" aria-label="Mapa de conexões: ${nodes.length} nós e ${edges.length} ligações"><circle cx="460" cy="355" r="92" fill="none" stroke="#8ca0c722" stroke-dasharray="5 9"/><circle cx="460" cy="355" r="250" fill="none" stroke="#8ca0c715" stroke-dasharray="2 15"/>${edges.map(l=>{const a=positions.get(l.from),b=positions.get(l.to);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${l.status==='hipotese'?'#d7a8f0':'#72c9cc'}" stroke-width="2" opacity=".75" ${l.status==='hipotese'?'stroke-dasharray="7 5"':''}/>`}).join('')}${nodes.map(n=>{const p=positions.get(n.id),color=c[n.kind],label=esc(n.label.length>18?n.label.slice(0,16)+'…':n.label);return `<g class="map-node" data-action="inspectNode" data-id="${esc(n.id)}" data-kind="${n.kind}"><circle cx="${p.x}" cy="${p.y}" r="38" fill="#172339" stroke="${color}" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="28" fill="${color}" opacity=".10"/><text x="${p.x}" y="${p.y-2}" text-anchor="middle" fill="${color}" font-size="20">${n.kind==='characters'?'♙':n.kind==='realities'?'◈':n.kind==='clues'?'⌕':'✧'}</text><text x="${p.x}" y="${p.y+14}" text-anchor="middle" fill="#e2ebff" font-size="9" font-weight="700">${label}</text></g>`}).join('')}</svg>`;}else svg=`<div class="empty" style="margin:120px 20px"><b>Nenhum nó no mapa</b>Adicione personagens, realidades, pistas ou teorias e as conexões aparecerão aqui.</div>`;const sel=mapSelected&&nodes.find(n=>n.id===mapSelected);return `<div class="grid cols2" style="grid-template-columns:minmax(0,1.7fr) minmax(300px,.9fr)"><div class="card"><div class="card-head"><h3>◎ Mapa interativo</h3><span class="pill">${nodes.length} nós · ${edges.length} linhas</span></div><div class="map-shell">${svg}</div><div class="legend" style="margin-top:14px">${Object.entries(c).map(([k,v])=>`<span><i class="dot" style="background:${v}"></i>${{characters:'Personagem',realities:'Realidade',clues:'Pista',theories:'Teoria'}[k]}</span>`).join('')}</div></div><div class="grid" style="align-content:start"><div class="card"><div class="card-head"><h3>Detalhes</h3></div>${sel?`<div class="eyebrow">${epCode(sel.season,sel.episode)}</div><h3 style="margin:8px 0">${esc(sel.label)}</h3><p class="smalltxt">${esc(sel.description||sel.text||'Sem detalhes.')}</p><button class="btn sm" data-action="editItem" data-kind="${sel.kind}" data-id="${esc(sel.id)}">Editar nó</button>`:blockEmpty('Selecione um nó','Clique em um personagem, pista, teoria ou realidade no mapa.')}</div><div class="card"><div class="card-head"><h3>Vincular descobertas</h3></div>${nodes.length>=2?`<div class="form-control"><label>Origem</label><select class="field" id="link-from">${nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.label)}</option>`).join('')}</select></div><div class="form-control" style="margin-top:10px"><label>Destino</label><select class="field" id="link-to">${nodes.map((n,i)=>`<option value="${esc(n.id)}" ${i===1?'selected':''}>${esc(n.label)}</option>`).join('')}</select></div><div class="form-control" style="margin-top:10px"><label>Descrição da ligação</label><input class="field" id="link-note" placeholder="Por que estão relacionados?"></div><div class="form-control" style="margin:10px 0"><label>Natureza</label><select class="field" id="link-status"><option value="confirmada">Conexão observada</option><option value="hipotese">Minha hipótese</option></select></div><button class="btn primary block" data-action="addLink">+ Criar conexão</button>`:blockEmpty('Precisamos de dois nós','Cadastre pelo menos dois elementos para poder conectá-los.')}</div></div></div><div class="section card"><div class="card-head"><h3>Conexões registradas</h3></div>${edges.length?`<div class="row-list">${edges.map(l=>{let a=nodes.find(n=>n.id===l.from),b=nodes.find(n=>n.id===l.to);return `<div class="item flex spread wrap"><div><div class="item-title">${esc(a.label)} ↔ ${esc(b.label)}</div><div class="meta">${esc(l.note||'Sem descrição')} · ${l.status==='hipotese'?'Hipótese':'Observado'}</div></div><button class="btn sm danger" data-action="remove" data-kind="links" data-id="${esc(l.id)}">Excluir</button></div>`}).join('')}</div>`:blockEmpty('Ainda não há conexões','As linhas são criadas por você ou pela análise importada.')}</div>`;}
function drawArchive(){const data=entries('snapshots').sort((a,b)=>a.season-b.season||a.episode-b.episode),as=entries('analyses');return `<div class="hint">📁 O arquivo preserva o que você sabia quando concluiu cada episódio. As conclusões posteriores não modificam automaticamente os registros anteriores.</div><div class="section grid cols2"><div class="card"><div class="card-head"><h3>Marcos da jornada</h3></div>${data.length?`<div class="timeline">${data.map(a=>`<div class="time-item"><div class="eyebrow">${epCode(a.season,a.episode)} · ${fmtdate(a.createdAt)}</div><h3 style="margin:8px 0">Episódio concluído</h3><p class="smalltxt">Naquele momento: ${a.counts?.records||0} impressões, ${a.counts?.clues||0} pistas, ${a.counts?.theories||0} teorias e ${a.counts?.links||0} conexões.</p><button class="btn sm" data-action="showSnapshot" data-id="${esc(a.id)}">Ver fotografia</button></div>`).join('')}</div>`:blockEmpty('Seu arquivo começa após E01','Conclua o primeiro episódio para preservar um marco da investigação.')}</div><div class="card"><div class="card-head"><h3>Análises importadas</h3></div>${as.length?`<div class="row-list">${as.map(a=>`<div class="item"><div class="item-title">${epCode(a.season,a.episode)}</div><p>${esc(a.summary||'Sem resumo')}</p><div class="flex wrap" style="margin-top:10px"><button class="btn sm" data-action="showAnalysis" data-id="${esc(a.id)}">Abrir análise</button><button class="btn sm" data-action="playAnalysis" data-id="${esc(a.id)}">🔊 Ouvir</button></div></div>`).join('')}</div>`:blockEmpty('Ainda não há análises','Peça uma pesquisa ao ChatGPT e importe o relatório JSON.')}</div></div>`;}
function drawSettings(){const {season,episode}=cur();return `<div class="grid cols2"><div class="card"><div class="card-head"><h3>💾 Armazenamento e backups</h3>${cloud?'<span class="pill good">Apps Script</span>':'<span class="pill good">Salvo neste navegador</span>'}</div><p class="smalltxt">${cloud?'Este painel utiliza o Google Apps Script e uma planilha criada automaticamente na sua conta. Use a mesma conta Google nos dois aparelhos.':'Este painel abre pelo mesmo endereço no computador e no tablet, mas os registros ficam salvos somente neste navegador. Para não perder suas anotações, baixe backups JSON regularmente.'}</p>${serverDatabase?`<p><a href="${esc(safeUrl(serverDatabase))}" target="_blank" rel="noopener">Abrir banco de dados no Google Sheets ↗</a></p>`:''}${cloud?`<p class="smalltxt">Pendências de sincronização: <b>${pending.length}</b></p>`:`<p class="smalltxt">Os dados deste navegador não são enviados ao GitHub.</p>`}<div class="flex wrap"><button class="btn primary sm" data-action="refresh">↻ Atualizar painel</button><button class="btn sm" data-action="exportBackup">↓ Baixar backup JSON</button><button class="btn sm" data-action="importBackup">↑ Importar backup</button></div></div><div class="card"><div class="card-head"><h3>🧠 Integração com o ChatGPT</h3></div><p class="smalltxt">O ChatGPT não lê automaticamente os registros deste navegador nem coloca análises no painel. Use o pacote do episódio e importe o JSON que eu devolver. Isso evita editar ou republicar o HTML.</p><div class="flex wrap"><button class="btn primary sm" data-action="copyPrompt">Copiar instrução da análise</button><button class="btn sm" data-action="exportContext">↓ Contexto do episódio</button></div><div class="divider"></div><div class="form-control"><label for="analysis-json">Cole o JSON gerado pelo ChatGPT</label><textarea class="field" id="analysis-json" rows="6" placeholder='{"atlasVersion":1,"season":${season},"episode":${episode},"analysis":{"summary":"...","questions":[]} function changeEpisode(season,ep){season=Number(season);ep=Number(ep);if(season===2&&prog(1)<9){notify('A temporada 2 fica bloqueada até concluir a temporada 1.',true);render();return;}if(ep>prog(season)+1){notify('Episódio bloqueado: conclua os anteriores.',true);render();return;}saveSettings({season,episode:ep});}

function finishEpisode(){const {season,episode}=cur();if(episode<=prog(season))return;if(episode!==prog(season)+1){notify('Conclua os episódios na ordem.',true);return;}if(!confirm(`Confirmar que você terminou ${epCode(season,episode)}? Isso habilita a análise sem spoilers deste episódio.`))return;const newProgress={...s().progress,[season]:episode};let counts={};['records','clues','theories','links','characters','realities'].forEach(kind=>counts[kind]=entries(kind,{all:true}).filter(x=>Number(x.season)===season&&Number(x.episode)<=episode).length);const snapshot={id:'snap_'+epCode(season,episode),season,episode,createdAt:new Date().toISOString(),counts,notes:currentItems('records').map(x=>({type:x.type,text:String(x.text||'').slice(0,1000)})),origin:'user'};const next={...s(),progress:newProgress,episode:episode};putBatch([{op:'upsert',kind:'snapshots',id:snapshot.id,item:snapshot},{op:'upsert',kind:'settings',id:'main',item:next}]);notify(`${epCode(season,episode)} concluído! Investigação liberada.`);}

function voiceHelp(){alert('COMO DITAR SEM DIGITAR\n\nNo tablet: toque no campo “Suas impressões”, abra o teclado e toque no símbolo de microfone do teclado.\n\nNo Windows: clique no campo e pressione Windows + H para iniciar o ditado.\n\nNo Chrome/Edge: também é possível tentar o botão “Iniciar voz”, caso o navegador libere o microfone.\n\nO Google Apps Script pode impedir acesso direto ao microfone. O ditado do teclado costuma funcionar mesmo assim.');}
function toggleVoice(){if(voiceOn){recognition?.stop();return;}const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){voiceHelp();return;}const ta=document.getElementById('voice-text');if(!ta)return;recognition=new API();voiceBase=ta.value.trim();recognition.lang='pt-BR';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{voiceOn=true;const btn=document.getElementById('voice-btn');if(btn)btn.textContent='■ Parar gravação';const t=document.getElementById('voice-status');if(t)t.textContent='🎙 Ouvindo... fale naturalmente. O texto será mostrado abaixo.'};recognition.onresult=event=>{let final='',interim='';for(let i=0;i<event.results.length;i++){const t=event.results[i][0].transcript;if(event.results[i].isFinal)final+=t+' ';else interim+=t+' ';}const box=document.getElementById('voice-text');if(box)box.value=[voiceBase,final.trim(),interim.trim()].filter(Boolean).join(' ').trim();};recognition.onerror=e=>{notify('Microfone indisponível ('+e.error+'). Use o microfone do teclado.',true)};recognition.onend=()=>{voiceOn=false;const btn=document.getElementById('voice-btn');if(btn)btn.textContent='🎙 Iniciar voz';const t=document.getElementById('voice-status');if(t)t.textContent='Ditado encerrado. Revise a transcrição e clique em Salvar impressão.'};try{recognition.start()}catch(e){voiceHelp()}}

function itemModal(kind,id){const isEdit=!!id,x=id?item(kind,id):null;if(id&&!x)return;const meta={characters:['Personagem','Nome','Características, relações e observações...'],realities:['Realidade','Nome da realidade','Como você reconheceu essa realidade?'],clues:['Pista','Título da pista','O que foi observado?'],theories:['Teoria','Título da teoria','Qual é sua hipótese e em quais pistas se apoia?']}[kind];if(!meta)return;const {season,episode}=cur();document.getElementById('modal-host').innerHTML=`<div class="modal-wrap" id="modal-bg"><div class="modal" role="dialog" aria-modal="true"><div class="flex spread"><div><div class="eyebrow">${epCode(season,episode)} · Investigação</div><h2>${isEdit?'Editar':'Criar'} ${meta[0].toLowerCase()}</h2></div><button class="btn icon-only sm" data-action="closeModal">✕</button></div><div class="modal-fields"><div class="form-control"><label>${meta[1]}</label><input id="modal-name" class="field" maxlength="150" value="${esc(x?.name||x?.title||'')}" placeholder="${esc(meta[1])}" autofocus></div><div class="form-control"><label>Descrição / evidências</label><textarea id="modal-description" class="field" rows="5" placeholder="${esc(meta[2])}">${esc(x?.description||x?.text||'')}</textarea></div><div class="form-control"><label>Estado</label><select id="modal-status" class="field">${(kind==='theories'?['Hipótese ativa','Reforçada','Refutada','Confirmada']:['Em aberto','Observado','Confirmado','Descartado']).map(a=>`<option ${x?.status===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn" data-action="closeModal">Cancelar</button><button class="btn primary" data-action="saveItem" data-kind="${kind}" data-id="${esc(id||'')}">✓ Salvar</button></div></div></div>`;}
function saveItem(kind,id){const name=document.getElementById('modal-name')?.value.trim(),descr=document.getElementById('modal-description')?.value.trim(),status=document.getElementById('modal-status')?.value;if(!name){notify('Informe um título ou nome.',true);return;}const old=id?item(kind,id):null,{season,episode}=cur(),obj={...(old||{}),id:id||uid(kind),season:old?.season||season,episode:old?.episode||episode,status,origin:old?.origin||'user'};if(kind==='characters'||kind==='realities'){obj.name=name;obj.description=descr}else{obj.title=name;obj.text=descr;}put(kind,obj);closeModal();notify('Registro salvo.');}

function importBackup(str){let doc;try{doc=JSON.parse(str)}catch(e){notify('Backup JSON inválido.',true);return;}if(doc.schema!=='atlas-backup-v1'||!doc.state){notify('Este arquivo não é um backup do Atlas.',true);return;}if(!confirm('Mesclar o backup com seus registros atuais? Registros com o mesmo identificador serão atualizados.'))return;const ops=[];TABLES.forEach(kind=>(Array.isArray(doc.state[kind])?doc.state[kind]:[]).forEach(x=>{if(x&&typeof x.id==='string'&&x.id.length<120)ops.push({kind,op:'upsert',id:x.id,item:x})}));if(!ops.length){notify('O backup não contém registros.',true);return;}putBatch(ops);notify(`${ops.length} registros do backup colocados na fila de sincronização.`);}
function importAnalysis(source){let doc;try{doc=typeof source==='string'?JSON.parse(source):source;}catch(e){notify('JSON inválido: '+e.message,true);return;}if(doc?.atlasVersion!==1||![1,2].includes(Number(doc.season))||!Number.isInteger(Number(doc.episode))){notify('JSON inválido: campos atlasVersion, season ou episode ausentes.',true);return;}const season=Number(doc.season),episode=Number(doc.episode);if(episode<1||episode>TOTAL[season]||episode>prog(season)){notify('Proteção antisspoiler: conclua esse episódio no painel antes de importar a análise.',true);return;}if(!doc.analysis||typeof doc.analysis.summary!=='string'){notify('JSON sem analysis.summary.',true);return;}if(!confirm(`Importar análise de ${epCode(season,episode)}? Itens da IA poderão ser adicionados ou revisados; seus registros pessoais não serão alterados.`))return;const ops=[];const keep={};const validKinds=['characters','realities','clues','theories'];
for(const kind of validKinds){for(const incoming of (Array.isArray(doc[kind])?doc[kind]:[]).slice(0,70)){if(!incoming||typeof incoming!=='object')continue;const field=(kind==='characters'||kind==='realities')?'name':'title';const key=String(incoming[field]||'').trim().slice(0,150);if(!key)continue;const existing=(state[kind]||[]).find(x=>x.origin==='assistant'&&x.season===season&&nrm(x[field])===nrm(key));const obj={...(existing||{}),id:existing?.id||uid(kind),season,episode:Number(existing?.episode||episode),origin:'assistant',status:String(incoming.status||'Em aberto').slice(0,80)};obj[field]=key;if(field==='name')obj.description=String(incoming.description||'').slice(0,1800);else obj.text=String(incoming.text||incoming.description||'').slice(0,1800);ops.push({kind,op:'upsert',id:obj.id,item:obj});keep[kind+':'+nrm(key)]=obj.id;}}
const oldAnalysis=(state.analyses||[]).find(x=>x.season===season&&x.episode===episode);const an={id:oldAnalysis?.id||uid('analysis'),season,episode,origin:'assistant',summary:String(doc.analysis.summary).slice(0,7500),highlights:Array.isArray(doc.analysis.highlights)?doc.analysis.highlights.slice(0,30).map(x=>String(x).slice(0,450)):[],questions:Array.isArray(doc.analysis.questions)?doc.analysis.questions.slice(0,30).map(x=>String(x).slice(0,450)):[]};ops.push({kind:'analyses',op:'upsert',id:an.id,item:an});
function resolve(kind,name){const k=kind+':'+nrm(name);if(keep[k])return keep[k];const x=(state[kind]||[]).find(item=>nrm(item.name||item.title)===nrm(name)&&Number(item.season)===season);return x?.id||''}
for(const l of (Array.isArray(doc.links)?doc.links:[]).slice(0,80)){if(!validKinds.includes(l.fromKind)||!validKinds.includes(l.toKind))continue;const from=resolve(l.fromKind,l.fromName),to=resolve(l.toKind,l.toName);if(!from||!to||from===to)continue;const old=(state.links||[]).find(x=>x.from===from&&x.to===to&&x.origin==='assistant');const obj={id:old?.id||uid('link'),season,episode,from,to,origin:'assistant',note:String(l.note||'').slice(0,500),status:l.status==='hipotese'?'hipotese':'confirmada'};ops.push({kind:'links',op:'upsert',id:obj.id,item:obj});}
ops.push({kind:'settings',op:'upsert',id:'main',item:{...s(),season,episode}});putBatch(ops);notify(`Análise de ${epCode(season,episode)} importada: ${ops.length-1} registro(s).`);setTab('episodes');}
function fileRead(file,callback){if(!file)return;const reader=new FileReader();reader.onload=()=>callback(String(reader.result||''));reader.onerror=()=>notify('Erro ao abrir arquivo.',true);reader.readAsText(file,'UTF-8')}
async function actionHandler(button){const act=button.dataset.action;if(!act)return;const kind=button.dataset.kind,id=button.dataset.id;switch(act){case'refresh':await refresh();break;case'gotoEpisode':changeEpisode(cur().season,button.dataset.episode);break;case'finishEpisode':finishEpisode();break;case'nextEpisode':nextEpisode();break;case'saveVoice':saveVoice();break;case'voiceHelp':voiceHelp();break;case'toggleVoice':toggleVoice();break;case'pickAudio':selectAudio(button.dataset.part);break;case'newItem':itemModal(kind);break;case'editItem':itemModal(kind,id);break;case'saveItem':saveItem(kind,id);break;case'closeModal':closeModal();break;case'remove':del(kind,id);break;case'addLink':addLink();break;case'inspectNode':mapSelected=id;render();break;case'showSnapshot':showSnapshot(id);break;case'showAnalysis':showAnalysis(id);break;case'playAnalysis':playAnalysis(id);break;case'listenAnalysis':listenAnalysis();break;case'copyPrompt':copyPrompt();break;case'exportBackup':exportBackup();break;case'importBackup':document.getElementById('backup-file').click();break;case'exportContext':exportContext();break;case'applyAnalysis':importAnalysis(document.getElementById('analysis-json')?.value||'');break;case'pickAnalysis':document.getElementById('analysis-file').click();break;}}
function bindEvents(){document.addEventListener('click',event=>{const tabButton=event.target.closest('[data-tab]');if(tabButton){setTab(tabButton.dataset.tab);return;}const actButton=event.target.closest('[data-action]');if(actButton){actionHandler(actButton).catch(err=>notify(err.message,true));return;}if(event.target.id==='modal-bg')closeModal();});document.addEventListener('change',event=>{const id=event.target.id;if(id==='sel-season'){const season=Number(event.target.value);changeEpisode(season,Math.min(prog(season)+1,TOTAL[season]));}if(id==='sel-episode')changeEpisode(cur().season,Number(event.target.value));if(id==='audio-file')readAudioFile(event.target.files?.[0]);if(id==='analysis-file')fileRead(event.target.files?.[0],importAnalysis);if(id==='backup-file')fileRead(event.target.files?.[0],importBackup);});document.addEventListener('input',event=>{if(event.target.id==='search-collection'){searchText=event.target.value;const focusStart=event.target.selectionStart;render();const box=document.getElementById('search-collection');box?.focus();box?.setSelectionRange(focusStart,focusStart);}});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});window.addEventListener('online',()=>{flush();refresh();});}
function init(){localLoad();bindEvents();render();if(cloud){refresh().then(flush);setInterval(()=>{if(!busy&&pending.length)flush();else if(!busy)refresh()},65000)}else notify('Modo online: seus registros são guardados neste navegador. Faça backups JSON regularmente.');}
init();
</script>

(() => {

const E01={"analysis":{"summary":"No episódio 1, Jason Dessen, professor de Física em Chicago, vive com Daniela e o filho Charlie. Após celebrar a premiação científica do amigo Ryan, ele é sequestrado, obrigado a trocar de roupas e sedado. Ao despertar, uma equipe da Velocity o reconhece como cientista importante, e Amanda e Leighton dizem que ele esteve ausente por 14 meses e 10 dias. Jason foge e encontra Amanda onde esperava ver Daniela. Em paralelo, um homem com a aparência de Jason chega à casa de Daniela. O episódio expõe vidas incompatíveis, mas ainda não explica o mecanismo nem as motivações. Pesquisa limitada a T1E01: Apple TV, What to Watch e TVLine.","highlights":["Ryan recebe o prêmio Pavia, e a conversa reabre a questão das escolhas profissionais de Jason.","O sequestrador conhece aspectos da vida pessoal de Jason e pergunta se ele está feliz.","Na Velocity, a equipe se refere a Jason como cofundador e cientista-chefe; ele não reconhece essa vida.","Leighton afirma que Jason esteve ausente por 14 meses e 10 dias e que foi o único a retornar.","O desfecho mostra duas chegadas incompatíveis e abre um mistério de identidade."],"questions":["Quem é o sequestrador, e o que pretendia com a troca de roupas e a injeção?","O que significam a caixa e o suposto retorno de Jason à Velocity?","Por que Amanda e Leighton têm lembranças tão diferentes das de Jason?","Como interpretar os dois percursos vistos no final sem antecipar uma explicação?","Quanto das escolhas pessoais e profissionais de Jason está ligado ao mistério?"]},"characters":[["jason","Jason Dessen","Professor de Física que vive com Daniela e Charlie. Após o sequestro, não reconhece a vida que a equipe da Velocity atribui a ele."],["daniela","Daniela Dessen","Esposa de Jason no cotidiano apresentado na abertura. Está em casa no desfecho do episódio."],["charlie","Charlie Dessen","Filho de Jason e Daniela na vida familiar apresentada no início."],["ryan","Ryan Holder","Amigo cientista de Jason, homenageado com o prêmio Pavia; conversa com Jason sobre oportunidades profissionais."],["amanda","Amanda","Mulher ligada à Velocity que cumprimenta Jason como alguém conhecido; aparece também na casa a que ele chega depois de fugir."],["leighton","Leighton Vance","Liderança da Velocity. Afirma que Jason é cientista-chefe e cofundador, e que esteve ausente por 14 meses e 10 dias."]],"realities":[["chicago-familia","Chicago — vida com Daniela","Cenário da abertura: Jason é professor, vive com Daniela e Charlie. Não presumir ainda como ele se relaciona com os outros cenários."],["chicago-velocity","Chicago — ambiente da Velocity","Cenário percebido após o despertar: Jason é tratado como alguém da equipe de pesquisa e encontra Amanda em vez de Daniela na casa. A explicação permanece aberta."]],"clues":[["pavia","Prêmio Pavia e escolhas","A premiação de Ryan põe em evidência oportunidades de vida e trabalho que Jason considerou.","Confirmado"],["abducao","Sequestro, troca e injeção","O desconhecido mascara o rosto, força Jason a trocar de roupa e aplica uma substância antes de ele perder a consciência.","Confirmado"],["caixa","A referência à caixa","O sequestrador manipula um objeto misterioso, e a equipe da Velocity fala do retorno de Jason de uma caixa. Função e relação ainda não explicadas.","Em aberto"],["ausencia","14 meses e 10 dias","Leighton informa que Jason esteve ausente por 14 meses e 10 dias. É uma afirmação do personagem, não uma linha do tempo comprovada.","Confirmado"],["desfecho","Duas chegadas incompatíveis","Jason chega a uma casa onde encontra Amanda; paralelamente, um homem com a aparência dele chega à casa de Daniela.","Confirmado"]],"links":[["characters:jason","characters:daniela","Casados no cenário familiar apresentado na abertura."],["characters:jason","characters:ryan","Amigos; a premiação de Ryan antecede o sequestro."],["characters:jason","realities:chicago-familia","Vida familiar de Jason na abertura."],["characters:jason","realities:chicago-velocity","Após despertar, Jason chega a esse cenário sem reconhecê-lo."],["characters:amanda","realities:chicago-velocity","Amanda aparece na Velocity e na casa encontrada por Jason."],["characters:leighton","realities:chicago-velocity","Leighton representa a equipe que reconhece Jason."],["clues:abducao","clues:desfecho","O sequestro antecede a mudança percebida por Jason."],["clues:ausencia","realities:chicago-velocity","A equipe da Velocity apresenta essa informação sobre o passado de Jason."]],"sources":["https://tv.apple.com/br/episode/are-you-happy-in-your-life/umc.cmc.59p6kv4nynpisd1gl300a7810?l=en&showId=umc.cmc.4luj45vtqpmjsvb6sc2675oeg","https://www.whattowatch.com/features/dark-matter-episode-1-recap-a-kidnapping-and-some-husband-swapping","https://www.tvline.com/recaps/dark-matter-premiere-recap-episode-1-apple-tv-plus-1235235510/"]};
function seedEpisodeOne(){
  if (typeof prog!=='function' || prog(1)<1 || !Array.isArray(state?.analyses)) return;
  const ops=[],ids={};
  function add(kind,key,name,description,status){
    const field=(kind==='characters'||kind==='realities')?'name':'title';
    const found=state[kind].find(x=>x.origin==='assistant'&&Number(x.season)===1&&nrm(x[field])===nrm(name));
    const id=found?.id||'case01_'+kind+'_'+key;
    ids[kind+':'+key]=id;
    if(found||state[kind].some(x=>x.id===id))return;
    const entry={id,season:1,episode:1,origin:'assistant',status:status||'Confirmado',source:'Pesquisa do episódio 1 (Apple TV, What to Watch, TVLine)',sourceUrls:E01.sources};
    entry[field]=name;entry[field==='name'?'description':'text']=description;
    ops.push({op:'upsert',kind,id,item:entry});
  }
  E01.characters.forEach(([key,name,description])=>add('characters',key,name,description));
  E01.realities.forEach(([key,name,description])=>add('realities',key,name,description));
  E01.clues.forEach(([key,name,description,status])=>add('clues',key,name,description,status));
  if(!state.analyses.some(x=>Number(x.season)===1&&Number(x.episode)===1)){
    const id='case01_analysis';
    ops.push({op:'upsert',kind:'analyses',id,item:{id,season:1,episode:1,origin:'assistant',...E01.analysis,sourceUrls:E01.sources}});
  }
  E01.links.forEach(([fromKey,toKey,note],i)=>{
    const from=ids[fromKey],to=ids[toKey],id='case01_link_'+i;
    if(!from||!to||state.links.some(x=>x.id===id||(x.from===from&&x.to===to)))return;
    ops.push({op:'upsert',kind:'links',id,item:{id,season:1,episode:1,from,to,note,status:'confirmada',origin:'assistant'}});
  });
  if(ops.length)putBatch(ops);
}
const previousFinish=finishEpisode;
finishEpisode=function(){previousFinish();seedEpisodeOne();};
seedEpisodeOne();
})();
</script>
